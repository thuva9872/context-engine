[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "devant-context-engine"
version = "0.0.1"
description = "Governed context engine API and durable control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "python-multipart==0.0.32",
  "uvicorn==0.53.0",
]

[project.scripts]
context-engine-api = "context_engine.api.main:main"
context-engine-migrate = "context_engine.persistence.migrate:main"
context-engine-serve = "context_engine.serve:main"
context-engine-worker = "context_engine.worker.main:main"

[project.optional-dependencies]
knowledge-provider = ["cognee==1.5.4", "morph-kgc==2.10.0", "rdflib==7.1.4"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "openapi-spec-validator==0.7.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pyyaml==6.0.2",
  "ruff==0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests", "../tests"]
markers = [
  "live_provider: requires the private provider, model credentials, and local stores",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves dependencies declared as parameter defaults.
extend-immutable-calls = ["fastapi.Depends"]
